<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HQ">
  <title>HQ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Boot sequence -->
  <div id="boot" class="boot">
    <div class="boot-scan"></div>
    <div class="boot-core">
      <svg class="boot-emblem" viewBox="0 0 120 120" aria-hidden="true">
        <polygon class="hex hex-outer" points="60,6 106,33 106,87 60,114 14,87 14,33"/>
        <polygon class="hex hex-inner" points="60,20 94,40 94,80 60,100 26,80 26,40"/>
        <text x="60" y="70" text-anchor="middle" class="hex-text">HQ</text>
      </svg>
      <div class="boot-log" id="bootLog"></div>
      <div class="boot-bar"><span></span></div>
      <div class="boot-skip">tap to skip</div>
    </div>
  </div>

  <div class="shell">
    <nav class="rail" id="nav" aria-label="Main"></nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="sheet" class="sheet-layer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
